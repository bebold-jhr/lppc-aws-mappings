name: integration-tests
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  detect-tests:
    # First run will show as "skipped" in PR checks
    # Only run on re-runs (triggered by /run integration-tests comment or manually)
    if: github.run_attempt > 1
    runs-on: ubuntu-latest
    outputs:
      test_dirs: ${{ steps.changed-files.outputs.test_dirs }}
    steps:
      - name: Get PR details
        uses: actions/github-script@v8
        id: get-pr
        with:
          script: |
            const pr = context.payload.pull_request;
            // Validate branch names contain only safe characters
            const branchRegex = /^[a-zA-Z0-9._\/-]+$/;
            if (!branchRegex.test(pr.head.ref) || !branchRegex.test(pr.base.ref)) {
              throw new Error('Invalid branch name detected');
            }
            console.log(`PR #${pr.number}: head_ref=${pr.head.ref}, head_sha=${pr.head.sha}`);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.get-pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Get changed files and determine tests to run
        id: changed-files
        env:
          BASE_REF: ${{ steps.get-pr.outputs.base_ref }}
        run: |
          # Paths to exclude from triggering integration tests
          # (e.g. to skip long-running tests on Renovate provider updates)
          # The EXCLUDE_PATHS array at the top of the step lets you maintain a static list of path patterns. Each entry is a grep pattern, so you can use:
          #   - Exact directory prefixes: "integration-tests/resource/aws_account_primary_contact/"
          #   - Broader patterns: "\.terraform\.lock\.hcl$" to skip all lock file changes
          #   - Simple substrings: "some_resource_name"
          EXCLUDE_PATHS=(
            "integration-tests/resource/aws_account_region/providers.tf", # takes > 5m30s
            "integration-tests/data/aws_ec2_transit_gateway/providers.tf", # takes > 3m28s
            "integration-tests/data/aws_ec2_transit_gateway_attachment/providers.tf", # takes > 5m16s
            "integration-tests/data/aws_ec2_transit_gateway_attachments/providers.tf", # takes > 6m36s
            "integration-tests/data/aws_ec2_transit_gateway_connect/providers.tf", # takes > 11m9s
            "integration-tests/data/aws_ec2_transit_gateway_connect_peer/providers.tf", # takes > 11m28s
            "integration-tests/data/aws_ec2_transit_gateway_multicast_domain/providers.tf", # takes > 4m15s
            "integration-tests/data/aws_ec2_transit_gateway_route_table/providers.tf", # takes > 6m6s
            "integration-tests/data/aws_ec2_transit_gateway_route_table_associations/providers.tf", # takes > 6m27s
            "integration-tests/data/aws_ec2_transit_gateway_route_table_propagations/providers.tf", # takes > 5m00s
            "integration-tests/data/aws_ec2_transit_gateway_route_table_routes/providers.tf", # takes > 5m00s
            "integration-tests/data/aws_ec2_transit_gateway_route_tables/providers.tf", # takes > 5m00s
            "integration-tests/data/aws_ec2_transit_gateway_vpc_attachment/providers.tf", # takes > 5m00s
            "integration-tests/data/aws_ec2_transit_gateway_vpc_attachments/providers.tf", # takes > 5m00s
          )

          # Fetch base branch for comparison
          git fetch origin "$BASE_REF"

          # Get all changed files
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD)

          # Filter out excluded paths
          for pattern in "${EXCLUDE_PATHS[@]}"; do
            CHANGED_FILES=$(echo "$CHANGED_FILES" | grep -v "$pattern" || true)
          done

          TEST_DIRS=""

          # 1. Check for changed mapping files -> run corresponding test
          CHANGED_MAPPINGS=$(echo "$CHANGED_FILES" | grep -E '^mappings/.*\.yaml$' | \
            grep -v 'yamllint-config.yaml' || true)

          for file in $CHANGED_MAPPINGS; do
            # Extract type and name from mappings/<type>/<name>.yaml
            if [[ "$file" =~ ^mappings/([^/]+)/([^/]+)\.yaml$ ]]; then
              TYPE="${BASH_REMATCH[1]}"
              NAME="${BASH_REMATCH[2]}"
              TEST_DIR="integration-tests/${TYPE}/${NAME}"

              if [ -d "$TEST_DIR" ]; then
                TEST_DIRS="$TEST_DIRS $TEST_DIR"
              fi
            fi
          done

          # 2. Check for changed integration test files -> run that test
          CHANGED_TESTS=$(echo "$CHANGED_FILES" | grep -E '^integration-tests/' || true)

          for file in $CHANGED_TESTS; do
            # Extract type and name from integration-tests/<type>/<name>/...
            # Skip files directly in integration-tests/ or integration-tests/modules/
            if [[ "$file" =~ ^integration-tests/([^/]+)/([^/]+)/ ]]; then
              TYPE="${BASH_REMATCH[1]}"
              NAME="${BASH_REMATCH[2]}"

              # Skip the shared modules directory
              if [ "$TYPE" = "modules" ]; then
                continue
              fi

              TEST_DIR="integration-tests/${TYPE}/${NAME}"
              if [ -d "$TEST_DIR" ]; then
                TEST_DIRS="$TEST_DIRS $TEST_DIR"
              fi
            fi
          done

          # Trim and deduplicate
          TEST_DIRS=$(echo "$TEST_DIRS" | xargs -n1 | sort -u | xargs)
          echo "Found test directories: $TEST_DIRS"

          if [ -z "$TEST_DIRS" ]; then
            echo "No relevant changes found (no mappings or integration test files changed)."
            echo 'test_dirs=[]' >> "$GITHUB_OUTPUT"
          else
            # Convert space-separated list to JSON array
            JSON_ARRAY=$(echo "$TEST_DIRS" | xargs -n1 | jq -R . | jq -sc .)
            echo "test_dirs=$JSON_ARRAY" >> "$GITHUB_OUTPUT"
          fi

  integration-test:
    needs: detect-tests
    if: needs.detect-tests.outputs.test_dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_dir: ${{ fromJson(needs.detect-tests.outputs.test_dirs) }}
    steps:
      - name: Get PR details
        uses: actions/github-script@v8
        id: get-pr
        with:
          script: |
            const pr = context.payload.pull_request;
            const branchRegex = /^[a-zA-Z0-9._\/-]+$/;
            if (!branchRegex.test(pr.head.ref)) {
              throw new Error('Invalid branch name detected');
            }
            core.setOutput('head_ref', pr.head.ref);

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.get-pr.outputs.head_ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_OIDC_ROLE_NAME }}
          role-session-name: integration-test-run-${{ github.run_id }}

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Run integration test
        env:
          TEST_DIR: ${{ matrix.test_dir }}
          TF_VAR_management_account_id: ${{ secrets.MANAGEMENT_ACCOUNT_ID }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_delegated_admin_account_id: ${{ secrets.DELEGATED_ADMIN_ACCOUNT_ID }}
          TF_VAR_original_address_line_1: ${{ secrets.ORIGINAL_ADDRESS_LINE_1 }}
          TF_VAR_original_city: ${{ secrets.ORIGINAL_CITY }}
          TF_VAR_original_company_name: ${{ secrets.ORIGINAL_COMPANY_NAME }}
          TF_VAR_original_phone_number: ${{ secrets.ORIGINAL_PHONE_NUMBER }}
          TF_VAR_original_postal_code: ${{ secrets.ORIGINAL_POSTAL_CODE }}
          TF_VAR_original_state_or_region: ${{ secrets.ORIGINAL_STATE_OR_REGION }}
          TF_VAR_original_website_url: ${{ secrets.ORIGINAL_WEBSITE_URL }}
        run: |
          cd "$TEST_DIR"
          terraform init -no-color
          SECONDS=0
          terraform test -no-color
          echo "Test $TEST_DIR ran $((SECONDS/60))m$((SECONDS%60))s"
