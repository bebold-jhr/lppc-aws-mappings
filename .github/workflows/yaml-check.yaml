---
name: yaml-checks

on:
  push:
    branches:
      - 'main'
    paths:
      - mappings/**/*.yaml
      - .github/workflows/yaml-check.yaml
  pull_request:
    branches:
      - '**'
    paths:
        - mappings/**/*.yaml
        - .github/workflows/yaml-check.yaml

permissions:
  contents: read

jobs:
  syntax-check:
    name: Check YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check YAML syntax
        run: |
          yamllint -c mappings/yamllint-config.yaml mappings
  schema-validation:
    name: Validate schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Validate schema
        run: |
          pip install yamale
          yamale -s mappings/schema.yamale mappings/action
          yamale -s mappings/schema.yamale mappings/data
          yamale -s mappings/schema.yamale mappings/ephemeral
          yamale -s mappings/schema.yamale mappings/resource
