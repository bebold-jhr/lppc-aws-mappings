---
# No integration test:
# Cannot change delegated admins of this organization
metadata:
  aws:
    documentation: https://docs.aws.amazon.com/service-authorization/latest/reference/reference_policies_actions-resources-contextkeys.html
    service-reference: https://servicereference.us-east-1.amazonaws.com/v1/organizations/organizations.json
  terraform:
    documentation: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/organizations_delegated_administrator
allow:
  - organizations:DeregisterDelegatedAdministrator
  - organizations:Describe*
  - organizations:List*
  - organizations:RegisterDelegatedAdministrator
  - organizations:TagResource
  - organizations:UntagResource
