---
# No integration test:
# Accounts take 90 days to be completely deleted
metadata:
  aws:
    documentation: https://docs.aws.amazon.com/service-authorization/latest/reference/reference_policies_actions-resources-contextkeys.html
    service-reference: https://servicereference.us-east-1.amazonaws.com/v1/organizations/organizations.json
  terraform:
    documentation: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/organizations_account
allow:
  - organizations:CloseAccount
  - organizations:CreateAccount
  - organizations:DescribeAccount
  - organizations:DescribeCreateAccountStatus
  - organizations:ListAccounts
  - organizations:MoveAccount
  - organizations:TagResource
  - organizations:UntagResource
conditional:
  create_govcloud:
    - organizations:CreateGovCloudAccount
