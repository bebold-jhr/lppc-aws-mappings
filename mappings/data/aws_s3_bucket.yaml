---
metadata:
  aws:
    documentation: https://docs.aws.amazon.com/service-authorization/latest/reference/reference_policies_actions-resources-contextkeys.html
    service-reference: https://servicereference.us-east-1.amazonaws.com/v1/s3/s3.json
  terraform:
    documentation: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/data-sources/s3_bucket
deny:
  - s3:GetObject
  - s3:GetObjectTorrent
  - s3:GetObjectVersion
  - s3:GetObjectVersionForReplication
  - s3:GetObjectVersionTorrent
allow:
  - s3:Describe*
  - s3:Get*
  - s3:List*
