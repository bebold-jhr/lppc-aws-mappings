# No integration test:
# Long teardown: CloudFront distributions take 15-20+ minutes to disable and delete
metadata:
  aws:
    documentation: https://docs.aws.amazon.com/service-authorization/latest/reference/reference_policies_actions-resources-contextkeys.html
    service-reference: https://servicereference.us-east-1.amazonaws.com/v1/cloudfront/cloudfront.json
  terraform:
    documentation: https://registry.terraform.io/providers/hashicorp/aws/latest/docs/data-sources/cloudfront_distribution
allow:
  - cloudfront:Describe*
  - cloudfront:Get*
  - cloudfront:List*
